<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#f6f4ef">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Wspólne listy zakupów, pakowania i zadań — na żywo, także offline.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Zakupy">
<title>Zakupy</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/css/app.css">
<link rel="modulepreload" href="/js/core.js">
<link rel="modulepreload" href="/js/store.js">
<link rel="modulepreload" href="/js/ui.js">
<script>
  // motyw przed pierwszym malowaniem (bez mignięcia)
  try { var p = JSON.parse(localStorage.getItem('lz3_prefs') || '{}'); if (p.theme && p.theme !== 'auto') document.documentElement.setAttribute('data-theme', p.theme); } catch (e) {}
</script>
</head>
<body>
  <a class="skip" href="#view">Przejdź do treści</a>
  <header id="topbar" class="topbar"><div class="tb-title pad"><h1>Zakupy</h1></div></header>

  <main id="view" class="view" tabindex="-1"></main>

  <div id="dock" class="dock" hidden>
    <div class="suggest" hidden></div>
    <div class="dock-target" hidden></div>
    <div class="parse-hint" hidden></div>
    <form class="dock-form" autocomplete="off">
      <button type="button" class="dock-btn" data-dock="group" aria-pressed="false" aria-label="Bagaż / grupa">📁</button>
      <textarea id="add-input" rows="1" enterkeyhint="send" autocapitalize="sentences" autocomplete="off" spellcheck="true" aria-label="Dodaj pozycję"></textarea>
      <button type="submit" class="dock-send" aria-label="Dodaj"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
    </form>
  </div>

  <nav id="tabs" class="tabs" aria-label="Nawigacja">
    <button type="button" data-tab="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1 1 2-2M3.5 12l1 1 2-2M3.5 18l1 1 2-2"/></svg><span>Listy</span></button>
    <button type="button" data-tab="templates"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg><span>Szablony</span></button>
    <button type="button" data-tab="notes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg><span>Notatki</span></button>
    <button type="button" data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>Więcej</span></button>
  </nav>

  <div id="gate" class="gate"></div>
  <div id="sheets"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <noscript><p style="padding:24px">Ta aplikacja wymaga włączonej obsługi JavaScript.</p></noscript>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
